name: Enquiry relay

# The deployed app can only mail an enquiry when RESEND_API_KEY exists in the
# Vercel environment. Until that variable is set there, /api/health reports
# "email":"none" and a licence request is stored but never reaches an inbox.
# This job closes that gap: every few minutes it mails anything still unsent,
# marks the record, and stops as soon as the app itself is sending.
#
# It also announces every new trial signup, so the first day of a teacher's
# month is not spent waiting for someone to open the owner dashboard, and sends
# the two trial-ending notes (a week out, and the day before) that turn a trial
# into a licence conversation instead of a silent expiry.
#
# The key lives in the repository secret RESEND_API_KEY (Settings → Secrets and
# variables → Actions), never in this file.

on:
  schedule:
    - cron: '*/5 * * * *'
  # GitHub can delay a scheduled run by many minutes — in this repository the
  # schedule did not fire at all in its first hundred minutes — so every push to
  # main sweeps too. A sweep costs seconds, is idempotent, and means an enquiry
  # never waits longer than the next deploy.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enquiry-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Send unsent enquiries
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'arnavjain@gcse.business' }}
        run: node scripts/relay-enquiries.mjs
